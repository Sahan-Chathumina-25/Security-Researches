<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Abstract illustration of source-code analysis with magnifier and research notes">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151e18"/><stop offset="1" stop-color="#0d120f"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.2" cy="0.1" r="1">
      <stop offset="0" stop-color="#b6f451" stop-opacity="0.1"/><stop offset="1" stop-color="#b6f451" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" rx="18" fill="url(#ag)"/>
  <rect width="800" height="420" rx="18" fill="url(#aglow)"/>
  <g stroke="#263329" stroke-width="1" opacity="0.5">
    <path d="M0 84h800M0 168h800M0 252h800M0 336h800"/>
    <path d="M114 0v420M228 0v420M342 0v420M456 0v420M570 0v420M684 0v420"/>
  </g>
